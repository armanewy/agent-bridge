<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AgentBridge</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        font-family: system-ui, sans-serif;
        color: #1f2933;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      p {
        margin: 6px 0 10px;
        font-size: 12px;
        color: #52616b;
      }

      button {
        width: 100%;
        margin: 0 0 8px;
        padding: 8px;
      }

      .secondary {
        background: #f6f8fa;
        border: 1px solid #d0d7de;
      }

      .status-line {
        margin: 8px 0 12px;
        padding: 8px;
        border: 1px solid #d8dee4;
        border-radius: 6px;
        font-size: 12px;
      }

      .status-ok {
        border-color: #9ad69a;
        background: #f0fff4;
      }

      .status-bad {
        border-color: #f0b5b5;
        background: #fff5f5;
      }

      #status,
      #diagnostics {
        min-height: 28px;
        font-size: 12px;
        color: #333;
        white-space: pre-wrap;
      }

      details {
        margin-top: 8px;
      }

      summary {
        cursor: pointer;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>AgentBridge</h1>
      <p id="active-tab">Checking active tab...</p>
    </header>

    <div id="connection" class="status-line">Desktop app: checking...</div>

    <section id="chatgpt-actions" hidden>
      <button id="sync">Sync this ChatGPT tab</button>
      <button id="capture">Capture selected text</button>
      <button id="latest">Capture latest answer</button>
      <p>Shortcut: Ctrl+Shift+Y captures selected text.</p>
    </section>

    <section id="not-chatgpt" hidden>
      <p>Open ChatGPT to sync this conversation.</p>
    </section>

    <button id="show-all" class="secondary">Show all ChatGPT tabs</button>
    <button id="health" class="secondary">Check desktop connection</button>

    <div id="status" role="status"></div>

    <details>
      <summary>Diagnostics</summary>
      <div id="diagnostics"></div>
    </details>

    <script type="module" src="dist/src/popup.js"></script>
  </body>
</html>
